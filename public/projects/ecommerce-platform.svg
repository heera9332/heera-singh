<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="ecomOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ecomBg)"/>
  <rect x="40" y="40" width="720" height="420" rx="16" fill="#111114" stroke="#27272a" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="40" y="40" width="720" height="55" rx="16" fill="#1c1c20"/>
  <rect x="70" y="58" width="100" height="18" rx="4" fill="url(#ecomOrange)"/>
  <rect x="650" y="54" width="80" height="26" rx="6" fill="#27272a"/>

  <!-- Left: Product Showcase -->
  <rect x="70" y="120" width="320" height="310" rx="12" fill="#18181b" stroke="#27272a"/>
  <rect x="90" y="140" width="280" height="160" rx="8" fill="#27272a"/>
  <rect x="90" y="320" width="180" height="18" rx="4" fill="#ffffff"/>
  <rect x="90" y="350" width="80" height="14" rx="4" fill="url(#ecomOrange)"/>
  <rect x="90" y="380" width="280" height="36" rx="8" fill="url(#ecomOrange)"/>

  <!-- Right: Single Page Fast Checkout -->
  <rect x="410" y="120" width="320" height="310" rx="12" fill="#18181b" stroke="#27272a"/>
  <text x="430" y="155" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">1-Step Fast Checkout</text>
  <rect x="430" y="175" width="280" height="34" rx="6" fill="#27272a"/>
  <rect x="430" y="220" width="280" height="34" rx="6" fill="#27272a"/>
  <!-- Payment methods -->
  <rect x="430" y="270" width="130" height="40" rx="6" fill="#27272a" stroke="url(#ecomOrange)" stroke-width="1.5"/>
  <rect x="580" y="270" width="130" height="40" rx="6" fill="#27272a"/>
  <rect x="430" y="330" width="280" height="40" rx="8" fill="#10b981"/>
  <text x="510" y="355" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="bold">Pay Securely</text>
  <text x="490" y="395" fill="#71717a" font-family="system-ui" font-size="11">🔒 256-Bit SSL Encrypted Checkout</text>
</svg>
